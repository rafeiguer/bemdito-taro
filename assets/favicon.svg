<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="55%" stop-color="#ff7518"/>
      <stop offset="100%" stop-color="#c84200"/>
    </radialGradient>
    <radialGradient id="ribGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffc86b"/>
      <stop offset="65%" stop-color="#ff8524"/>
      <stop offset="100%" stop-color="#d44b00"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fff380"/>
      <stop offset="85%" stop-color="#ffae00"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cabinho e folha fofa -->
  <path d="M46 24 C45 13, 52 7, 58 9 C61 10, 60 15, 55 16 C53 16, 53 20, 54 24 Z" fill="#4a9e3f" stroke="#2d6826" stroke-width="2" stroke-linejoin="round"/>
  <path d="M55 18 Q67 13 65 22 Q59 25 54 21 Z" fill="#68c957" stroke="#2d6826" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Gomos laterais da abóbora -->
  <ellipse cx="26" cy="58" rx="20" ry="30" fill="url(#bodyGrad)" stroke="#8a2be2" stroke-opacity="0.15" stroke-width="1"/>
  <ellipse cx="74" cy="58" rx="20" ry="30" fill="url(#bodyGrad)" stroke="#8a2be2" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Gomos intermediários -->
  <ellipse cx="36" cy="59" rx="20" ry="32" fill="url(#ribGrad)" stroke="#a33300" stroke-width="1.4"/>
  <ellipse cx="64" cy="59" rx="20" ry="32" fill="url(#ribGrad)" stroke="#a33300" stroke-width="1.4"/>

  <!-- Gomo central -->
  <ellipse cx="50" cy="60" rx="19" ry="33" fill="url(#ribGrad)" stroke="#a33300" stroke-width="1.4"/>

  <!-- Brilho superior fofo -->
  <ellipse cx="37" cy="38" rx="6" ry="3" transform="rotate(-20 37 38)" fill="#ffe4b5" opacity="0.55"/>

  <!-- Bochechas rosadas fofas -->
  <ellipse cx="22" cy="64" rx="6.5" ry="4" fill="#ff3b94" opacity="0.55"/>
  <ellipse cx="78" cy="64" rx="6.5" ry="4" fill="#ff3b94" opacity="0.55"/>

  <!-- Olhos iluminados (cute rounded triangles/ovals with glow) -->
  <g filter="url(#glow)">
    <!-- Olho esquerdo -->
    <path d="M26 55 C26 44, 41 44, 41 55 C41 58, 26 58, 26 55 Z" fill="url(#eyeGlow)" stroke="#9e3200" stroke-width="1.5"/>
    <!-- Olho direito -->
    <path d="M59 55 C59 44, 74 44, 74 55 C74 58, 59 58, 59 55 Z" fill="url(#eyeGlow)" stroke="#9e3200" stroke-width="1.5"/>

    <!-- Brilho estrelinha nos olhos -->
    <circle cx="31" cy="50" r="2.3" fill="#ffffff"/>
    <circle cx="64" cy="50" r="2.3" fill="#ffffff"/>

    <!-- Narizinho triangular fofo iluminado -->
    <path d="M50 56 L46.5 62 L53.5 62 Z" fill="url(#eyeGlow)" stroke="#9e3200" stroke-width="1" stroke-linejoin="round"/>

    <!-- Sorriso Jack-o'-lantern fofo com dentinho arredondado -->
    <path d="M31 67 Q40 73 45 72 L45 69 L50 69 L50 72.5 Q55 72.5 55 69 L59 69 L59 71.5 Q65 70.5 69 67 Q66 81 50 81 Q34 81 31 67 Z" fill="url(#eyeGlow)" stroke="#9e3200" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
