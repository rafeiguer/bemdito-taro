<!doctype html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Configurações — Bem Dito Tarot</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tela Configurações (configuracoes/editor.js): formulários para a Tryv editar textos, fotos e vídeos. */
:root {
  --veludo: #2b1a5e; --noite: #1b1546; --fundo: #120e2e; --ouro: #f2c14e; --ouro-claro: #ffe6a3; --rosa: #ff2d87; --rosa-claro: #ff8cc0;
  --verde: #1f9d62; --vermelho: #e8452c;
  --texto: #f6f0ff; --texto-2: #c9bfe6; --campo: #fff; --campo-texto: #1d1640; --borda: rgba(242, 193, 78, .28);
  --vidro: rgba(255, 255, 255, .05); --raio: 14px;
  --display: "Cinzel", Georgia, serif; --corpo: "Jost", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fundo); color: var(--texto); font: 400 1.05rem/1.5 var(--corpo); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
a { color: var(--ouro); }
button, input, textarea, select { font: inherit; }
:focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; }

/* Topo fixo: situação, Publicar e as abas */
.topo { position: sticky; top: 0; z-index: 20; background: var(--veludo); border-bottom: 3px solid var(--ouro); padding: .6rem 16px 0; box-shadow: 0 6px 20px rgba(0, 0, 0, .4); }
.topo__linha { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem 1rem; max-width: 980px; margin: 0 auto; }
.marca { font-family: var(--display); color: var(--ouro-claro); text-decoration: none; font-size: 1.25rem; }
.topo__titulo { font-weight: 600; font-size: 1.05rem; }
.situacao { margin-left: auto; font-size: .9rem; color: #b8f0d2; font-weight: 600; }
.situacao::before { content: "● "; }
.situacao--pendente { color: var(--ouro); }
.topo__acoes { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; max-width: 980px; margin: .5rem auto 0; }
.abas { display: flex; gap: .3rem; overflow-x: auto; max-width: 980px; margin: .6rem auto 0; scrollbar-width: none; }
.abas::-webkit-scrollbar { display: none; }
.aba { flex: none; background: none; border: 0; color: var(--texto-2); padding: .45rem .8rem .55rem; border-radius: 10px 10px 0 0; font-weight: 600; cursor: pointer; }
.aba[aria-current="true"] { background: var(--fundo); color: var(--ouro-claro); }

/* Botões */
.botao { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: .45rem 1.1rem; border-radius: 999px;
  border: 2px solid var(--ouro); background: var(--ouro); color: #2a1606; font-weight: 600; cursor: pointer; text-decoration: none; }
.botao--claro { background: transparent; color: #fff; border-color: var(--borda); }
.botao--claro:hover { border-color: var(--ouro); }
.botao--publicar { background: var(--verde); border-color: var(--verde); color: #fff; }
.botao--publicar:disabled { background: transparent; border-color: var(--borda); color: var(--texto-2); cursor: default; }
.botao--texto { background: none; border-color: transparent; color: var(--texto-2); font-weight: 500; text-decoration: underline; }
.icone { width: 40px; height: 40px; flex: none; border-radius: 10px; border: 1px solid var(--borda); background: var(--vidro); color: #fff; cursor: pointer; font-size: 1.1rem; }
.icone:disabled { opacity: .3; cursor: default; }
.icone--apagar:hover { background: var(--vermelho); border-color: var(--vermelho); }
.link { color: var(--ouro); font-weight: 600; }
.marcar-en { display: inline-flex; align-items: center; gap: .4rem; font-size: .95rem; color: var(--texto-2); cursor: pointer; margin-left: auto; }
.marcar-en input { width: 20px; height: 20px; accent-color: var(--ouro); }

/* Painel */
#painel { max-width: 980px; margin: 0 auto; padding: 1.4rem 16px 4rem; }
.intro { color: var(--texto-2); margin: 0 0 1.4rem; max-width: 70ch; }
.intro strong { color: var(--texto); }
.campo { margin: 0 0 1.1rem; }
.campo > label, .grupo > legend { display: block; font-weight: 600; margin-bottom: .3rem; }
.dica { margin: -.1rem 0 .5rem; font-size: .9rem; color: var(--texto-2); }
input[type="text"], input[type="email"], input[type="url"], input[type="tel"], input[type="password"], input[type="number"], textarea, select {
  width: 100%; background: var(--campo); color: var(--campo-texto); border: 2px solid transparent; border-radius: 10px; padding: .55rem .75rem; line-height: 1.45; }
input[type="number"] { width: 6rem; }
textarea { resize: vertical; min-height: 4.5rem; }
input:focus, textarea:focus, select:focus { border-color: var(--ouro); outline: none; }
input[type="color"] { width: 54px; height: 44px; border: 0; background: none; padding: 0; cursor: pointer; flex: none; }
.campo--curto select { width: auto; min-width: 12rem; }
/* Inglês: logo abaixo do português, menor e com a bandeirinha "EN" */
.en { display: flex; align-items: flex-start; gap: .4rem; margin-top: .3rem; }
.en::before { content: "EN"; flex: none; margin-top: .45rem; font-size: .72rem; font-weight: 600; letter-spacing: .08em; color: var(--fundo); background: var(--ouro-claro); border-radius: 6px; padding: .05rem .35rem; }
.en input, .en textarea { background: #efeaff; font-size: .95rem; }
.en textarea { min-height: 3rem; }
.aviso-en { margin: .3rem 0 0; font-size: .85rem; color: var(--ouro); }
.grupo { border: 1px solid var(--borda); border-radius: var(--raio); padding: .9rem 1rem 1rem; margin: 0 0 1.4rem; background: var(--vidro); min-width: 0; }
.grupo > legend { padding: 0 .4rem; font-size: 1.1rem; color: var(--ouro-claro); }
.linha { display: flex; gap: .5rem; align-items: flex-start; margin-bottom: .6rem; }
.linha > .campo, .linha > .texto-lista { flex: 1; min-width: 0; margin: 0; }
.controles { display: flex; gap: .3rem; flex: none; }
.duas { display: grid; gap: 0 1rem; grid-template-columns: 1fr 1fr; }
.tres { display: grid; gap: 0 1rem; grid-template-columns: 1fr 1fr 1fr; }
.datas { display: flex; flex-wrap: wrap; gap: .4rem 1rem; align-items: center; margin-bottom: 1.1rem; }
.datas label { font-weight: 600; }
.cor { display: flex; gap: .5rem; align-items: center; margin-bottom: .5rem; }
.cor .campo { flex: 1; margin: 0; }
.acoes { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .4rem; }
.arquivo label { cursor: pointer; }
.arquivo input:focus-visible + label { outline: 3px solid var(--ouro); outline-offset: 2px; }
.vazio { color: var(--texto-2); font-style: italic; margin: 0 0 .6rem; }
.selo { position: absolute; top: 6px; left: 6px; background: var(--verde); color: #fff; font-size: .75rem; font-weight: 600; padding: 0 .5rem; border-radius: 999px; }
.fixo { font-size: .9rem; color: var(--texto-2); margin: 0 0 .8rem; }

/* Fotos */
.fotos { list-style: none; margin: 0 0 .8rem; padding: 0; display: grid; gap: .9rem; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.foto { display: flex; flex-direction: column; gap: .4rem; }
.foto__img { position: relative; aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: rgba(0, 0, 0, .3); box-shadow: 0 0 0 3px var(--ouro); }
.foto__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto--capa .foto__img { aspect-ratio: auto; border-radius: 6px; max-width: 200px; }
.foto--capa .foto__img img { height: auto; }
.foto .campo { margin: 0; }
.foto .campo > label { font-size: .85rem; margin-bottom: .1rem; }
.foto .campo--curto select { min-width: 0; width: 100%; }
.foto .controles { justify-content: flex-end; }

/* Vídeos */
.novo-video .linha { margin: 0; }
.videos { list-style: none; margin: 1.2rem 0 0; padding: 0; display: grid; gap: 1rem; }
.video { display: grid; grid-template-columns: 200px 1fr auto; gap: 1rem; align-items: start; padding: .9rem; border: 1px solid var(--borda); border-radius: var(--raio); background: var(--vidro); }
.video img { width: 100%; border-radius: 8px; display: block; }
.video .campo { margin-bottom: .6rem; }

/* Sub-partes de uma aba (Descubra-se, Casinha) */
.chips { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: 1.4rem; }
.chip { min-height: 44px; padding: .3rem 1rem; border-radius: 999px; border: 2px solid var(--borda); background: transparent; color: #fff; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ouro); border-color: var(--ouro); color: #2a1606; }

/* Cartões que abrem e fecham (cada carta, anjo, sabbat, deus…) */
details.cartao { border: 1px solid var(--borda); border-radius: var(--raio); background: var(--vidro); margin-bottom: .6rem; }
details.cartao > summary { display: flex; align-items: center; gap: .7rem; padding: .55rem .8rem; cursor: pointer; list-style: none; min-height: 52px; }
details.cartao > summary::-webkit-details-marker { display: none; }
details.cartao > summary::before { content: "▸"; color: var(--ouro); transition: rotate .15s; }
details.cartao[open] > summary::before { rotate: 90deg; }
details.cartao > summary strong { flex: 1; min-width: 0; font-weight: 600; }
details.cartao > summary .marca-item { flex: none; min-width: 2.2rem; text-align: center; font-size: 1.25rem; font-family: "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols", serif; color: var(--ouro-claro); }
details.cartao > summary small { color: var(--texto-2); font-weight: 400; }
.cartao__corpo { padding: .6rem 1rem 1rem; border-top: 1px solid var(--borda); }
.cartao .cartao { background: rgba(0, 0, 0, .15); }

/* Avisos e progresso */
#avisos { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; z-index: 50; display: grid; gap: .5rem; width: min(560px, 100vw - 32px); }
.aviso { display: flex; align-items: center; gap: .6rem; padding: .7rem 1rem; border-radius: 12px; background: var(--veludo); border: 2px solid var(--ouro); box-shadow: 0 10px 28px rgba(0, 0, 0, .45); font-weight: 500; }
.aviso--erro { border-color: var(--vermelho); background: #4a1420; }
.aviso--ok { border-color: var(--verde); background: #0f3b2a; }
.aviso a { color: var(--ouro); }
.aviso__fechar { margin-left: auto; background: none; border: 0; color: #fff; font-size: 1.4rem; cursor: pointer; line-height: 1; }
.entrada .aviso { position: static; box-shadow: none; }
#progresso { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(5, 4, 20, .6); }
#progresso[hidden] { display: none; }
.progresso__caixa { display: flex; align-items: center; gap: .8rem; background: var(--veludo); padding: 1rem 1.4rem; border-radius: var(--raio); font-weight: 600; border: 2px solid var(--ouro); }
.progresso__roda { width: 26px; height: 26px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, .25); border-top-color: var(--ouro); animation: gira .8s linear infinite; }
@keyframes gira { to { rotate: 360deg; } }

/* Entrada (chave de acesso) */
.entrada { max-width: 480px; margin: 12vh auto; padding: 0 16px; }
.entrada h1 { font-family: var(--display); font-weight: 600; color: var(--ouro-claro); font-size: 1.9rem; line-height: 1.2; }
.entrada p { color: var(--texto-2); }
.entrada form { display: grid; gap: .6rem; margin: 1.4rem 0; }
.entrada label { font-weight: 600; }
.pe { max-width: 980px; margin: 0 auto; padding: 0 16px 6rem; }

@media (max-width: 640px) {
  .duas, .tres { grid-template-columns: 1fr; }
  .video { grid-template-columns: 1fr; }
  .video img { max-width: 260px; }
  .video .controles { justify-content: flex-end; }
  .fotos { grid-template-columns: 1fr 1fr; gap: .7rem; }
  .linha { flex-direction: column; align-items: stretch; }
  .linha .controles { justify-content: flex-end; }
  .topo__acoes .botao { flex: 1; }
  .topo__acoes .botao--texto { flex-basis: 100%; min-height: 32px; }
  .marcar-en { margin-left: 0; flex-basis: 100%; }
  details.cartao > summary .controles .icone { width: 36px; height: 36px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="avisos" aria-live="polite"></div>
<div id="progresso" hidden><div class="progresso__caixa"><span class="progresso__roda" aria-hidden="true"></span><span class="progresso__texto" role="status"></span></div></div>
<noscript><p style="padding:2rem">A tela Configurações precisa de JavaScript ligado.</p></noscript>
<script type="module" src="configuracoes/editor.js"></script>
</body>
</html>
